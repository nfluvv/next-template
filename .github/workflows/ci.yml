name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Push schema to test DB
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.CI_AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.CI_AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.CI_AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.CI_AUTH_GOOGLE_SECRET }}
          RESEND_API_KEY: ${{ secrets.CI_RESEND_API_KEY }}
          MAIL_PROVIDER: ${{ secrets.CI_MAIL_PROVIDER }}
          TWO_FACTOR_ENCRYPTION_KEY: ${{ secrets.CI_TWO_FACTOR_ENCRYPTION_KEY }}
          NEXTAUTH_URL: ${{ secrets.CI_NEXTAUTH_URL }}
